[package]
name = "yesplaymusic-tauri"
version = "0.14.0"
description = "Yokaze 的跨平台 Tauri 客户端"
authors = ["Yokaze contributors"]
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace]
members = ["core", "sidecar", "tui"]
resolver = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cookie = "0.18.1"
discord-rich-presence = "1.1.0"
dirs = "=6.0.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
getrandom = "0.2"
leveldb-core = "0.1.2"
reqwest = { version = "0.11.27", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
tauri = { version = "2", features = ["tray-icon", "macos-proxy"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri-plugin-updater = "=2.10.1"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tempfile = "3.27"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.189"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSObject", "NSSet", "NSString", "NSValue"] }
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSButton", "NSButtonTouchBarItem", "NSControl", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSTouchBar", "NSTouchBarItem", "NSView", "NSWindow"] }

[target.'cfg(target_os = "linux")'.dependencies]
futures-lite = "2.6"
mpris-server = "0.10.0"
zbus = "5.19.0"

# Async WebView2 cookie reads for the QQ Music login; pinned to the versions
# wry 0.55 links so the COM interfaces are the same types.
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows-core = "=0.61.2"
# Taskbar docking: UI Automation probing, WinEvent hooks and raw window
# placement. Same version as tao/wry so `WebviewWindow::hwnd` is our HWND.
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[patch.crates-io]
tauri-plugin-updater = { path = "patches/tauri-plugin-updater-2.10.1" }

# Debug builds keep our own crates unoptimized for fast compiles, but let
# dependencies (JPEG decode, resize, FFT, audio) run at full speed — cover
# switches and the spectrum are otherwise 10x slower when testing.
[profile.dev.package."*"]
opt-level = 2
# Full dependency debuginfo was most of target/debug's 20+ GiB; line tables
# keep file:line in backtraces through dependencies.
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
